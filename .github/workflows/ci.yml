name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Prefer the same Xcode the project was validated against; fall back to the
      # newest stable image install if 26.6 is ever removed from the runner.
      - name: Select Xcode
        id: xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: '26.6'
        continue-on-error: true

      - name: Select Xcode (fallback latest-stable)
        if: steps.xcode.outcome != 'success'
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: swift test
        run: swift test

      - name: no raw animation curves outside Theme.swift
        # Every animation must go through Theme.motion() (via microMotion/stateChange/
        # layoutChange/pageTransition/selectionSlide) so Reduce Motion and TUSI_SLOWMO
        # can never be silently bypassed by a call site. StreamingPlaceholder's
        # decorative pulse is the one deliberate, documented exception.
        run: |
          if grep -rn --include='*.swift' -E '\.snappy\(|\.easeOut\(|\.easeInOut\(|\.spring\(|\.linear\(' Sources/Tusi/UI Sources/Tusi/PanelController.swift Sources/Tusi/RootView.swift Sources/Tusi/PreviewSupport.swift 2>/dev/null | grep -v 'Theme.swift' | grep -v 'motion-exception'; then
            echo "Found a raw animation curve outside Theme.swift — route it through a Theme.* motion token instead." >&2
            exit 1
          fi

      - name: release build gate (strict concurrency, warnings-as-errors)
        run: ./build.sh release

      # Only reached when tests + release gate both succeed. Uploading the zips here
      # means a red CI never produces downloadable CI artifacts for a release cut.
      - name: upload release zips
        uses: actions/upload-artifact@v7
        with:
          name: Tusi-release-zips
          path: |
            dist/Tusi-arm64.zip
            dist/Tusi-universal.zip
          if-no-files-found: error
