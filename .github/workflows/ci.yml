name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: lint localization and scripts
        run: |
          plutil -lint Sources/Tusi/Resources/en.lproj/Localizable.strings Sources/Tusi/Resources/zh-Hans.lproj/Localizable.strings
          bash -n build.sh scripts/readme-screenshots.sh

      - name: swift test
        run: swift test

      - name: swift test (parallel)
        run: swift test --parallel

      - name: release build gate (strict concurrency, warnings-as-errors)
        run: ./build.sh release
