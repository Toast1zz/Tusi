name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: swift test
        run: swift test

      - name: release build gate (strict concurrency, warnings-as-errors)
        run: ./build.sh release
